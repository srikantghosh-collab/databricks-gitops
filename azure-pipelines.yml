trigger:
  - main

variables:
  PYTHON_VERSION: '3.10'
  PIPELINE_IS_REVERT: 'false'
  PIPELINE_BACKUP_MODE: 'NONE'
  PIPELINE_IS_DROP: 'false'
  PIPELINE_ROLLBACK_TYPE: 'NONE'

# ======================
# STAGE 1: DETECT
# ======================
stages:
- stage: Detect
  displayName: "Detect DDL Changes"
  jobs:
  - job: detect
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      fetchDepth: 0

    - task: UsePythonVersion@0
      inputs:
        versionSpec: $(PYTHON_VERSION)

    - script: python scripts/detect_ddl.py
      name: detectddl
      displayName: "Detect DDL"

    - script: python scripts/detect_revert.py
      name: detectrevert
      displayName: "Detect Git Revert"

    - script: |
        echo "##vso[task.setvariable variable=PIPELINE_IS_REVERT]$(detectrevert.IS_REVERT)"
        echo "##vso[task.setvariable variable=PIPELINE_REVERT_COMMIT]$(detectrevert.REVERT_COMMIT)"
      displayName: "Promote Revert Variables"

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: ddl_output.json
        artifact: ddlartifact

# ======================
# STAGE 2: AI CLASSIFICATION
# ======================
- stage: AI
  dependsOn: Detect
  jobs:
  - job: ai
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self

    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: ddlartifact
        path: .

    - task: UsePythonVersion@0
      inputs:
        versionSpec: $(PYTHON_VERSION)

    - script: python -m pip install "openai>=1.30.0"

    - script: python scripts/classify_ddl_ai.py
      name: SetOutput
      env:
        AZURE_OPENAI_KEY: $(AZURE_OPENAI_KEY)
        AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
        AZURE_DEPLOYMENT_NAME: $(AZURE_DEPLOYMENT_NAME)

    # 🔑 CRITICAL FIX
    - script: |
        echo "##vso[task.setvariable variable=PIPELINE_BACKUP_MODE]$(SetOutput.BACKUP_MODE)"
        echo "##vso[task.setvariable variable=PIPELINE_IS_DROP]$(SetOutput.IS_DROP)"
        echo "##vso[task.setvariable variable=PIPELINE_ROLLBACK_TYPE]$(SetOutput.ROLLBACK_TYPE)"
      displayName: "Promote AI Outputs"

# ======================
# STAGE 3: ROLLBACK SQL (ADVISORY)
# ======================
- stage: RollbackGen
  dependsOn: AI
  condition: ne(variables.PIPELINE_BACKUP_MODE, 'DATA')
  jobs:
  - job: rollback
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self

    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: ddlartifact
        path: .

    - task: UsePythonVersion@0
      inputs:
        versionSpec: $(PYTHON_VERSION)

    - script: python -m pip install "openai>=1.30.0"

    - script: python scripts/ai_rollback_generator.py

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: $(System.DefaultWorkingDirectory)
        artifact: rollback-sql

# ======================
# STAGE 4: MANUAL APPROVAL
# ======================
- stage: Approval
  dependsOn: AI
  condition: eq(variables.PIPELINE_IS_DROP, 'true')
  jobs:
  - job: approval
    pool: server
    steps:
    - task: ManualValidation@0
      inputs:
        instructions: "DROP / irreversible DDL detected"
        timeoutInMinutes: 1440

# ======================
# STAGE 5: EXECUTE
# ======================
- stage: Execute
  dependsOn: [AI, RollbackGen, Approval]
  condition: |
    and(
      ne(variables.PIPELINE_IS_REVERT, 'true'),
      or(
        eq(variables.PIPELINE_IS_DROP, 'false'),
        succeeded('Approval')
      )
    )
  jobs:
  - job: execute
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self

    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: ddlartifact
        path: .

    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: rollback-sql
        path: .

    - task: UsePythonVersion@0
      inputs:
        versionSpec: $(PYTHON_VERSION)

    - script: python -m pip install databricks-sql-connector azure-storage-blob

    - script: python scripts/capture_table_state.py
      displayName: "STATE BACKUP"
      condition: eq(variables.PIPELINE_BACKUP_MODE, 'STATE')

    - script: python scripts/execute_ddl.py
      env:
        DATABRICKS_HOST: $(Databricks_Host)
        DATABRICKS_TOKEN: $(Databricks_Token)
        DATABRICKS_HTTP_PATH: $(Databricks_HTTP_Path)
        BACKUP_MODE: $(PIPELINE_BACKUP_MODE)
        ROLLBACK_TYPE: $(PIPELINE_ROLLBACK_TYPE)

# ======================
# STAGE 6: RECONCILE
# ======================
- stage: Reconcile
  dependsOn: Execute
  condition: succeeded()
  jobs:
  - job: reconcile
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
    - task: UsePythonVersion@0
      inputs:
        versionSpec: $(PYTHON_VERSION)
    - script: |
        pip install databricks-sql-connector pyyaml
        python scripts/reconcile_schema.py

# ======================
# STAGE 7: AUTO ROLLBACK
# ======================
- stage: AutoRollback
  dependsOn: Detect
  condition: eq(variables.PIPELINE_IS_REVERT, 'true')
  jobs:
  - job: rollback
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
    - task: UsePythonVersion@0
      inputs:
        versionSpec: $(PYTHON_VERSION)

    - script: python -m pip install azure-storage-blob databricks-sql-connector

    - script: python scripts/fetch_rollback_metadata.py

    - script: python scripts/restore_from_backup.py
      condition: eq(variables.PIPELINE_BACKUP_MODE, 'DATA')

    - script: python scripts/restore_table_state.py
      condition: eq(variables.PIPELINE_BACKUP_MODE, 'STATE')