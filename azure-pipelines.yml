trigger:
  - main

# ======================
# STAGE 1: DETECT
# ======================
stages:
- stage: Detect
  displayName: "Detect DDL Changes"
  jobs:
  - job: detect
    displayName: "Detection Job"
    pool:
      name: selfhostedpool
    steps:
    - checkout: self
      fetchDepth: 0

    - script: |
        python --version
        python scripts/detect_ddl.py
      name: detectddl
      displayName: "Detect DDL"

    - script: |
        python scripts/detect_revert.py
      name: detectrevert
      displayName: "Detect Git Revert"

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: 'ddl_output.json'
        artifact: 'ddlartifact'
      displayName: "Publish DDL Artifact"

# ======================
# STAGE 2: AI CLASSIFICATION
# ======================
- stage: AI
  displayName: "AI DDL Classification"
  dependsOn: Detect
  condition: |
    and(
      succeeded(),
      ne(stageDependencies.Detect.detect.outputs['detectrevert.is_revert_str'], 'yes')
    )
  jobs:
  - job: ai
    displayName: "AI Job"
    pool:
      name: selfhostedpool
    steps:
    - checkout: self

    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: 'ddlartifact'
        path: .
      displayName: "Download DDL Artifact"

    - script: |
        python -m pip install -U pip
        python -m pip install "openai>=1.30.0"
      displayName: "Install Azure OpenAI SDK"

    - script: |
        python scripts/classify_ddl_ai.py
      name: SetOutput
      displayName: "Run AI Classification"
      env:
        AZURE_OPENAI_KEY: $(AZURE_OPENAI_KEY)
        AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
        AZURE_DEPLOYMENT_NAME: $(AZURE_DEPLOYMENT_NAME)

    - script: |
        echo "##vso[task.setvariable variable=PIPELINE_IS_DROP]$(SetOutput.IS_DROP)"
        echo "##vso[task.setvariable variable=PIPELINE_BACKUP_MODE]$(SetOutput.BACKUP_MODE)"
      displayName: "Promote AI Variables"

      env:
        IS_DROP: $(SetOutput.IS_DROP)
        BACKUP_MODE: $(SetOutput.BACKUP_MODE)
        ROLLBACK_TYPE: $(SetOutput.ROLLBACK_TYPE)

    -  script: |
        echo "PIPELINE_IS_REVERT=$PIPELINE_IS_REVERT"
        echo "PIPELINE_IS_DROP=$PIPELINE_IS_DROP"
        

# ======================
# STAGE 3: GENERATE ROLLBACK SCRIPT
# ======================
- stage: RollbackGen
  displayName: "Generate AI Rollback SQL"
  dependsOn: AI
  condition: |
    and(
      succeeded('AI'),

      ne(stageDependencies.AI.ai.outputs['SetOutput.BACKUP_MODE'], 'DATA')
       )
  jobs:
  - job: rollback
    pool:
      name: selfhostedpool
    steps:
    - checkout: self

    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: 'ddlartifact'
        path: .

    - script: |
        python -m pip install "openai>=1.30.0"
        python scripts/ai_rollback_generator.py
      displayName: "Generate Rollback SQL"
      env:
        AZURE_OPENAI_KEY: $(AZURE_OPENAI_KEY)
        AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
        AZURE_DEPLOYMENT_NAME: $(AZURE_DEPLOYMENT_NAME)

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: $(System.DefaultWorkingDirectory)
        artifact: rollback-sql
      displayName: "Publish Rollback SQL"

    

# ======================
# STAGE 4: MANUAL APPROVAL
# ======================
- stage: Approval
  displayName: "Manual Approval for DROP"
  dependsOn: AI
  condition: |
    and(
      succeeded('AI'),
      eq(stageDependencies.AI.ai.outputs['SetOutput.IS_DROP'], 'true')
    )
  jobs:
  - job: approval
    pool: server
    steps:
    - task: ManualValidation@0
      inputs:
        instructions: "DROP or irreversible DDL detected. Approve to continue."
        timeoutInMinutes: 1440

# ======================
# STAGE 5: EXECUTE DDL
# ======================
- stage: Execute
  displayName: "Execute DDL"
  dependsOn:
    - Detect
    - AI
    - Approval
  condition: |
    and(
    succeeded('Detect'),
    succeeded('AI'),
    eq(variables.PIPELINE_IS_REVERT, 'no'),
    or(
      eq(variables.PIPELINE_IS_DROP, 'false'),
      succeeded('Approval')
    )
    )
  jobs:
  - job: execute
    pool:
      name: selfhostedpool
    steps:
    - checkout: self

    

    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: 'ddlartifact'
        path: .

    - task: DownloadPipelineArtifact@2
      condition: eq(variables.PIPELINE_BACKUP_MODE, 'STATE')
      inputs:
        artifact: 'rollback-sql'
        path: .

    - script: |
        python -m pip install databricks-sql-connector azure-storage-blob
      displayName: "Install Databricks + Azure SDK"

    - script: |
        python scripts/capture_table_state.py
      condition: eq(variables.PIPELINE_BACKUP_MODE, 'STATE')
      displayName: "Capture Table State"
      env:
        DATABRICKS_HOST: $(Databricks_Host)
        DATABRICKS_TOKEN: $(Databricks_Token)
        DATABRICKS_HTTP_PATH: $(Databricks_HTTP_Path)

    - script: |
        python scripts/execute_ddl.py
      displayName: "Execute DDL"
      env:
        DATABRICKS_HOST: $(Databricks_Host)
        DATABRICKS_TOKEN: $(Databricks_Token)
        DATABRICKS_HTTP_PATH: $(Databricks_HTTP_Path)
        ROLLBACK_TYPE: $(PIPELINE_ROLLBACK_TYPE)
        IS_DROP: $(PIPELINE_IS_DROP)
        BACKUP_MODE: $(PIPELINE_BACKUP_MODE)
        AZURE_BLOB_ACCOUNT_URL: $(AZURE_BLOB_ACCOUNT_URL)
        AZURE_BLOB_CONTAINER: $(AZURE_BLOB_CONTAINER)
        AZURE_BLOB_SAS: $(AZURE_BLOB_SAS)

# ======================
# STAGE 6: RECONCILE
# ======================
- stage: Reconcile
  displayName: "Schema Reconciliation"
  dependsOn: Execute
  condition: succeeded('Execute')
  jobs:
  - job: reconcile
    pool:
      name: selfhostedpool
    steps:
    - checkout: self

    - script: |
        python -m pip install databricks-sql-connector pyyaml
        python scripts/reconcile_schema.py
      displayName: "Run Reconciliation"
      env:
        AUTO_FIX: "false"
        DATABRICKS_HOST: $(Databricks_Host)
        DATABRICKS_TOKEN: $(Databricks_Token)
        DATABRICKS_HTTP_PATH: $(Databricks_HTTP_Path)

# ======================
# STAGE 7: AUTO ROLLBACK (GIT REVERT)
# ======================
- stage: AutoRollback
  displayName: "Auto Rollback (Git Revert)"
  dependsOn: Detect
  condition: |
    eq(
      stageDependencies.Detect.detect.outputs['detectrevert.is_revert_str'],
      'yes'
    )
  variables:
    REVERT_COMMIT: $[ stageDependencies.Detect.detect.outputs['detectrevert.REVERT_COMMIT'] ]

  jobs:
  - job: rollback
    displayName: "Auto Restore (DATA or STATE)"
    pool:
      name: selfhostedpool
    steps:
    - checkout: self
      fetchDepth: 0

    - script: |
        python -m pip install databricks-sql-connector
      displayName: "Install dependencies"

    - script: |
        python scripts/restore_from_backup.py
      displayName: "Auto Restore (DATA or STATE)"
      env:
        REVERT_COMMIT: $(REVERT_COMMIT)
        DATABRICKS_HOST: $(Databricks_Host)
        DATABRICKS_TOKEN: $(Databricks_Token)
        DATABRICKS_HTTP_PATH: $(Databricks_HTTP_Path)