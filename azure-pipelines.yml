trigger:
  - main

variables:
  PYTHON_VERSION: '3.10'

# ======================
# STAGE 1: DETECT
# ======================
stages:
- stage: Detect
  displayName: "Detect DDL Changes"
  jobs:
  - job: detect
    displayName: "Detection Job"
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      fetchDepth: 0

    - task: UsePythonVersion@0
      inputs:
        versionSpec: $(PYTHON_VERSION)

    - script: |
        python scripts/detect_ddl.py
      name: detectddl
      displayName: "Detect DDL"

    - script: |
        python scripts/detect_revert.py
      name: detectrevert
      displayName: "Detect Git Revert"

    #  CRITICAL FIX: Promote output vars correctly
    # - script: |
    #     echo "Promoting revert flags to pipeline scope"
    #     echo "IS_REVERT=$(detectrevert.IS_REVERT)"
    #     echo "REVERT_COMMIT=$(detectrevert.REVERT_COMMIT)"

    #     echo "##vso[task.setvariable variable=PIPELINE_IS_REVERT;isOutput=false]$(detectrevert.IS_REVERT)"
    #     echo "##vso[task.setvariable variable=PIPELINE_REVERT_COMMIT;isOutput=false]$(detectrevert.REVERT_COMMIT)"
    #   displayName: "Promote Revert Variables"

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: 'ddl_output.json'
        artifact: 'ddlartifact'
      displayName: "Publish DDL Artifact"

# ======================
# STAGE 2: AI CLASSIFICATION
# ======================
- stage: AI
  displayName: "AI DDL Classification"
  dependsOn: Detect
  jobs:
  - job: ai
    displayName: "AI Job"
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self

    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: 'ddlartifact'
        path: .
      displayName: "Download DDL Artifact"

    - task: UsePythonVersion@0
      inputs:
        versionSpec: $(PYTHON_VERSION)

    - script: |
        python -m pip install "openai>=1.30.0"
      displayName: "Install Azure OpenAI SDK"

    - script: |
        python scripts/classify_ddl_ai.py
      name: SetOutput
      displayName: "Run AI Classification"
      env:
        AZURE_OPENAI_KEY: $(AZURE_OPENAI_KEY)
        AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
        AZURE_DEPLOYMENT_NAME: $(AZURE_DEPLOYMENT_NAME)

    - script: |
        echo "Promoting AI outputs to pipeline scope"

        echo "IS_DROP=$IS_DROP"
        echo "BACKUP_MODE=$BACKUP_MODE"
        echo "ROLLBACK_TYPE=$ROLLBACK_TYPE"

        echo "##vso[task.setvariable variable=PIPELINE_IS_DROP]$IS_DROP"
        echo "##vso[task.setvariable variable=PIPELINE_BACKUP_MODE]$BACKUP_MODE"
        echo "##vso[task.setvariable variable=PIPELINE_ROLLBACK_TYPE]$ROLLBACK_TYPE"
      displayName: "Promote AI Variables"
      env:
       IS_DROP: $(SetOutput.IS_DROP)
       BACKUP_MODE: $(SetOutput.BACKUP_MODE)
       ROLLBACK_TYPE: $(SetOutput.ROLLBACK_TYPE)
# ======================
# STAGE 3: GENERATE ROLLBACK SCRIPT (AI – advisory only)
# ======================
- stage: RollbackGen
  displayName: "Generate AI Rollback SQL"
  dependsOn: AI
  condition: |
    and(
    succeeded(),
    ne(variables.PIPELINE_BACKUP_MODE, 'DATA')
    )
  jobs:
  - job: rollback
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self

    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: 'ddlartifact'
        path: .

    - task: UsePythonVersion@0
      inputs:
        versionSpec: $(PYTHON_VERSION)

    - script: |
        python -m pip install "openai>=1.30.0"
      displayName: "Install Azure OpenAI SDK"

    - script: |
        python scripts/ai_rollback_generator.py
      displayName: "Generate Rollback SQL"
      env:
        AZURE_OPENAI_KEY: $(AZURE_OPENAI_KEY)
        AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
        AZURE_DEPLOYMENT_NAME: $(AZURE_DEPLOYMENT_NAME)

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: $(System.DefaultWorkingDirectory)
        artifact: rollback-sql
      displayName: "Publish Rollback SQL"

# ======================
# STAGE 4: MANUAL APPROVAL (DROP ONLY)
# ======================
- stage: Approval
  displayName: "Manual Approval for DROP"
  dependsOn: AI
  condition: |
    and(
    succeeded(),
    eq(variables.PIPELINE_IS_DROP, 'true')
    )
  jobs:
  - job: approval
    pool: server
    steps:
    - task: ManualValidation@0
      inputs:
        instructions: "DROP or irreversible DDL detected. Approve to continue."
        timeoutInMinutes: 1440

# ======================
# STAGE 5: EXECUTE DDL
# ======================
- stage: Execute
  displayName: "Execute DDL"
  dependsOn:
    - AI
  condition: |
    and(
    succeeded('AI'),
    ne(variables.PIPELINE_IS_REVERT, 'true'),
    or(
      succeeded('Approval'),
      not(eq(stageDependencies.AI.ai.result, 'SucceededWithIssues'))
    )
     )
  jobs:
  - job: execute
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self

    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: 'ddlartifact'
        path: .

    - task: DownloadPipelineArtifact@2
      condition: eq(variables.PIPELINE_BACKUP_MODE, 'STATE')
      inputs:
        artifact: 'rollback-sql'
        path: .

    - task: UsePythonVersion@0
      inputs:
        versionSpec: $(PYTHON_VERSION)

    - script: |
        python -m pip install databricks-sql-connector azure-storage-blob
      displayName: "Install Databricks + Azure SDK"

    #  STATE BACKUP (ALTER / PROPERTY CHANGE)
    - script: |
        python scripts/capture_table_state.py
      displayName: "Capture Table State (STATE_BACKUP)"
      condition: eq(variables.PIPELINE_BACKUP_MODE, 'STATE')
      env:
        DATABRICKS_HOST: $(Databricks_Host)
        DATABRICKS_TOKEN: $(Databricks_Token)
        DATABRICKS_HTTP_PATH: $(Databricks_HTTP_Path)

    - script: |
        python scripts/execute_ddl.py
      displayName: "Execute DDL"
      env:
        DATABRICKS_HOST: $(Databricks_Host)
        DATABRICKS_TOKEN: $(Databricks_Token)
        DATABRICKS_HTTP_PATH: $(Databricks_HTTP_Path)
        ROLLBACK_TYPE: $(PIPELINE_ROLLBACK_TYPE)
        IS_DROP: $(PIPELINE_IS_DROP)
        BACKUP_MODE: $(PIPELINE_BACKUP_MODE)
        AZURE_BLOB_ACCOUNT_URL: $(AZURE_BLOB_ACCOUNT_URL)
        AZURE_BLOB_CONTAINER: $(AZURE_BLOB_CONTAINER)
        AZURE_BLOB_SAS: $(AZURE_BLOB_SAS)

# ======================
# STAGE 6: SCHEMA RECONCILIATION
# ======================
- stage: Reconcile
  displayName: "Schema Reconciliation"
  dependsOn: Execute
  condition: succeeded('Execute')
  jobs:
  - job: reconcile
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self

    - task: UsePythonVersion@0
      inputs:
        versionSpec: $(PYTHON_VERSION)

    - script: |
        pip install databricks-sql-connector pyyaml
        python scripts/reconcile_schema.py
      displayName: "Run Reconciliation"
      env:
        AUTO_FIX: "false"
        DATABRICKS_HOST: $(Databricks_Host)
        DATABRICKS_TOKEN: $(Databricks_Token)
        DATABRICKS_HTTP_PATH: $(Databricks_HTTP_Path)

# ======================
# STAGE 7: AUTO ROLLBACK (GIT REVERT)
# ======================
- stage: AutoRollback
  displayName: "Auto Rollback (Git Revert)"
  dependsOn: Detect
  # condition: eq(variables.PIPELINE_IS_REVERT, 'true')
  condition: |
    eq(
    stageDependencies.Detect.detect.outputs['detectrevert.IS_REVERT'],
    'true'
    )
  variables:
      # REVERT_COMMIT: $(PIPELINE_REVERT_COMMIT)
       REVERT_COMMIT: $[ stageDependencies.Detect.detect.outputs['detectrevert.REVERT_COMMIT'] ]
  jobs:
  - job: rollback
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      fetchDepth: 0

    - task: UsePythonVersion@0
      inputs:
        versionSpec: $(PYTHON_VERSION)

    - script: |
        python -m pip install azure-storage-blob databricks-sql-connector
      displayName: "Install dependencies"

    - script: |
        python scripts/fetch_rollback_metadata.py
      displayName: "Fetch rollback metadata"
      env:
        AZURE_BLOB_ACCOUNT_URL: $(AZURE_BLOB_ACCOUNT_URL)
        AZURE_BLOB_CONTAINER: rollback-metadata
        AZURE_BLOB_SAS: $(AZURE_BLOB_SAS)
        REVERT_COMMIT: $(REVERT_COMMIT)

    #  DATA restore (DROP)
    - script: |
        python scripts/restore_from_backup.py
      condition: eq(variables.PIPELINE_BACKUP_MODE, 'DATA')
      displayName: "Restore Table Data"
      env:
        DATABRICKS_HOST: $(Databricks_Host)
        DATABRICKS_TOKEN: $(Databricks_Token)
        DATABRICKS_HTTP_PATH: $(Databricks_HTTP_Path)

    #  STATE restore (ALTER / PROPERTIES)
    - script: |
        python scripts/restore_table_state.py
      condition: eq(variables.PIPELINE_BACKUP_MODE, 'STATE')
      displayName: "Restore Table State"
      env:
        DATABRICKS_HOST: $(Databricks_Host)
        DATABRICKS_TOKEN: $(Databricks_Token)
        DATABRICKS_HTTP_PATH: $(Databricks_HTTP_Path)