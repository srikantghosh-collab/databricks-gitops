trigger:
  - main

stages:
  - stage: Detect
    displayName: "Detect DDL Changes"
    jobs:
      - job: detect
        displayName: "Detection Job"
        pool:
          name: selfhostedpool
        steps:
          - checkout: self
            fetchDepth: 0

          - script: |
              python --version
              python scripts/detect_ddl.py
            name: detectddl
            displayName: "Detect DDL"

          - script: |
              python scripts/detect_revert.py
            name: detectrevert
            displayName: "Detect Git Revert"


          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: 'ddl_output.json'
              artifact: 'ddlartifact'
            displayName: "Publish DDL Artifact"

  - stage: AI
    displayName: "AI DDL Classification"
    dependsOn: Detect
    jobs:
      - job: ai
        displayName: "AI Job"
        pool:
          name: selfhostedpool
        steps:
          - checkout: self

          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: 'ddlartifact'
              path: .
            displayName: "Download DDL Artifact"

          - script: |
              python -m pip install -U pip
              python -m pip install "openai>=1.30.0"
            displayName: "Install Azure OpenAI SDK"

          - script: |
              python scripts/classify_ddl_ai.py
            name: SetOutput
            displayName: "Run AI Classification"
            env:
              AZURE_OPENAI_KEY: $(AZURE_OPENAI_KEY)
              AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
              AZURE_DEPLOYMENT_NAME: $(AZURE_DEPLOYMENT_NAME)

          - script: |
             echo "##vso[task.setvariable variable=PIPELINE_IS_DROP;isOutput=true]$IS_DROP"
             echo "##vso[task.setvariable variable=PIPELINE_ROLLBACK_TYPE;isOutput=true]$ROLLBACK_TYPE"
            name: PromoteVars
            displayName: "Promote AI Variables"
            env:
             IS_DROP: $(SetOutput.IS_DROP)
             ROLLBACK_TYPE: $(SetOutput.ROLLBACK_TYPE)

          - script: |
             echo "DEBUG IS_DROP = $(SetOutput.IS_DROP)"
             echo "DEBUG PIPELINE_IS_DROP = $(PIPELINE_IS_DROP)"
            displayName: "Debug AI Variables"

  - stage: RollbackGen
    displayName: "Generate AI Rollback SQL"
    dependsOn: AI
    condition: |
     and(
     succeeded(),
     ne(dependencies.Detect.outputs['detect.detectrevert.PIPELINE_IS_REVERT'], 'yes')
     )
    jobs:
      - job: rollback
        pool:
          name: selfhostedpool
        steps:
          - checkout: self

          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: 'ddlartifact'
              path: .

          - script: |
             python -m pip install "openai>=1.30.0"
             python scripts/ai_rollback_generator.py
            displayName: "Generate Rollback SQL"
            env:
             AZURE_OPENAI_KEY: $(AZURE_OPENAI_KEY)
             AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
             AZURE_DEPLOYMENT_NAME: $(AZURE_DEPLOYMENT_NAME)

             DATABRICKS_HOST: $(Databricks_Host)
             DATABRICKS_HTTP_PATH: $(Databricks_HTTP_Path)
             DATABRICKS_TOKEN: $(Databricks_Token)
             DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
             CLIENT_SECRET: $(CLIENT_SECRET)
             TENANT_ID: $(TENANT_ID)
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: rollback.sql
              artifact: rollback-sql
            displayName: "Publish Rollback SQL"

          - script: |
             python scripts/upload_rollback_to_workspace.py
            displayName: "Upload Rollback SQL to Databricks"
            env:
              DATABRICKS_HOST: $(Databricks_Host)
              DATABRICKS_TOKEN: $(Databricks_Token)
              DATABRICKS_HTTP_PATH: $(Databricks_HTTP_Path)
              DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
              CLIENT_SECRET: $(CLIENT_SECRET)
              TENANT_ID: $(TENANT_ID)
              COMMIT_ID: $(Build.SourceVersion)

  - stage: Approval
    displayName: "Manual Approval for DROP"
    dependsOn: AI
    
    condition: |
      eq(stageDependencies.AI.ai.outputs['PromoteVars.PIPELINE_IS_DROP'], 'true')
    jobs:
      - job: approval
        pool: server
        steps:
          - task: ManualValidation@0
            inputs:
              instructions: "DROP or irreversible DDL detected. Approve to continue."
              timeoutInMinutes: 1440

  - stage: Execute
    displayName: "Execute DDL"
    dependsOn:
      - Detect
      - AI
      - Approval
    condition: |
        ne(stageDependencies.Detect.detect.outputs['detectrevert.PIPELINE_IS_REVERT'], 'yes')
    jobs:
      - job: execute
        pool:
          name: selfhostedpool
        steps:
          - checkout: self

          - script: |
              echo "=== MEMORY BEFORE INSTALL ==="
              free -h
              echo "=== TOP MEMORY PROCESSES ==="
              ps aux --sort=-%mem | head
            displayName: "Debug Memory Before Install"
        

          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: 'ddlartifact'
              path: .

          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: 'rollback-sql'
              path: .

          - script: |
              python -m pip install --upgrade databricks-sql-connector 
            displayName: "Install Databricks Connector"

          
          - script: |
             echo "=== MEMORY AFTER INSTALL ==="
             free -h
             ps aux --sort=-%mem | head
            displayName: "Debug Memory After Install"
            
          - script: |
              python -u scripts/execute_ddl.py
            displayName: "Execute DDL"
            env:
             DATABRICKS_HOST: $(Databricks_Host)
             DATABRICKS_HTTP_PATH: $(Databricks_HTTP_Path)
             DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
             ROLLBACK_TYPE: $(PIPELINE_ROLLBACK_TYPE)
             IS_DROP: $(PIPELINE_IS_DROP)
             PIPELINE_IS_REVERT: $[stageDependencies.Detect.detect.outputs['detectrevert.PIPELINE_IS_REVERT']]

  - stage: Reconcile
    displayName: "Schema Reconciliation"
    dependsOn: Execute
    condition: succeeded('Execute')
    jobs:
      - job: reconcile
        pool:
          name: selfhostedpool
        steps:
          - checkout: self

          - script: |
              python -m pip install databricks-sql-connector pyyaml
              python scripts/reconcile_schema.py
            displayName: "Run Reconciliation"
            env:
              AUTO_FIX: "false"
              DATABRICKS_HOST: $(Databricks_Host)
              DATABRICKS_HTTP_PATH: $(Databricks_HTTP_Path)
              DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
              CLIENT_SECRET: $(CLIENT_SECRET)
              TENANT_ID: $(TENANT_ID)

  - stage: AutoRollback
    displayName: "Auto Rollback (Git Revert)"
    dependsOn:
      - Detect
      - AI
    variables:
       PIPELINE_IS_REVERT: $[ stageDependencies.Detect.detect.outputs['detectrevert.PIPELINE_IS_REVERT'] ]
       REVERT_COMMIT: $[ stageDependencies.Detect.detect.outputs['detectrevert.REVERT_COMMIT'] ]
    jobs:
      - job: debug
        pool:
          name: selfhostedpool
        steps:
         - script: |
             echo "PIPELINE_IS_REVERT=$(PIPELINE_IS_REVERT)"
             echo "REVERT_COMMIT=$(REVERT_COMMIT)"
           displayName: "Debug Revert Vars"

      - job: rollback
        dependsOn: debug
        condition: eq(stageDependencies.Detect.detect.outputs['detectrevert.PIPELINE_IS_REVERT'],'yes')
        pool:
          name: selfhostedpool
        steps:
          - checkout: self
            fetchDepth: 0

          - script: |
              python -m pip install databricks-sql-connector
            displayName: "Install dependencies"

          - script: |
              python scripts/restore_ddl.py
            displayName: "Auto Rollback using rollback.sql"
            env:
             REVERT_COMMIT: $(REVERT_COMMIT)
             DATABRICKS_HOST: $(Databricks_Host)
             DATABRICKS_HTTP_PATH: $(Databricks_HTTP_Path)
             DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
             CLIENT_SECRET: $(CLIENT_SECRET)
             TENANT_ID: $(TENANT_ID)